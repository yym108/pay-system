# 本地环境。make up 只启动基础设施和 kafka-init，以及 profile obs。
# 应用容器仍在 profile apps 中占位，健康检查属于 OPS-01，make up / make up-lite 不启用该 profile。
# BASE-03 替换了 migrate / seed 的命令，并用 bootstrap 建库授权；它们仍不随 make up 启动。
name: pay-system

x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully
  bootstrap:
    condition: service_completed_successfully
  migrate:
    condition: service_completed_successfully
  seed:
    condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=500
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:8.10.2
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      CLUSTER_ID: ZyizIAN2R0ad6PqH5Ne0Gw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 25s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "/init/topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
    volumes:
      # 相对仓库根：compose.sh 把 project directory 设为仓库根，避免自动读取 deploy/.env。
      - ./deploy/kafka/init-topics.sh:/init/topics.sh:ro

  prometheus:
    profiles:
      - obs
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # 相对仓库根，原因同 kafka-init 的脚本挂载。
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  jaeger:
    profiles:
      - obs
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    # 13133 只在容器内供健康检查使用，不映射到宿主机。
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "--spider", "-q", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  bootstrap:
    profiles:
      - apps
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: bootstrap
    image: pay-system-bootstrap:local
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      ACCOUNT_DB_DSN_0: ${ACCOUNT_DB_DSN_0:?set ACCOUNT_DB_DSN_0}
      ACCOUNT_DB_DSN_1: ${ACCOUNT_DB_DSN_1:?set ACCOUNT_DB_DSN_1}
      MYSQL_DSN: ${MYSQL_DSN:?set MYSQL_DSN}
      MYSQL_RECON_PASSWORD: ${MYSQL_RECON_PASSWORD:?set MYSQL_RECON_PASSWORD}
      MYSQL_CHANNEL_MOCK_PASSWORD: ${MYSQL_CHANNEL_MOCK_PASSWORD:?set MYSQL_CHANNEL_MOCK_PASSWORD}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?set MYSQL_MIGRATOR_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  migrate:
    profiles:
      - apps
    image: migrate/migrate:v4.20.1
    restart: "no"
    environment:
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?set MYSQL_MIGRATOR_PASSWORD}
      MYSQL_HOST: mysql
    volumes:
      # 相对仓库根：compose.sh 把 project directory 设为仓库根。
      - ./migrations:/migrations:ro
      - ./deploy/migrate/run.sh:/run.sh:ro
    entrypoint: ["/bin/sh", "/run.sh"]
    command: ["up"]
    depends_on:
      mysql:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  seed:
    profiles:
      - apps
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: seed
    image: pay-system-seed:local
    restart: "no"
    environment:
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?set SECRET_MASTER_KEY}
      PLATFORM_SUB_ACCOUNTS: ${PLATFORM_SUB_ACCOUNTS:-8}
      ACCOUNT_DB_DSN_0: ${ACCOUNT_DB_DSN_0:?set ACCOUNT_DB_DSN_0}
      ACCOUNT_DB_DSN_1: ${ACCOUNT_DB_DSN_1:?set ACCOUNT_DB_DSN_1}
      MYSQL_DSN: ${MYSQL_DSN:?set MYSQL_DSN}
      DEMO_APP_SECRET_FORMAT: ${DEMO_APP_SECRET_FORMAT:-demo_secret_%s_0123456789ab}
      SEED_LOAD: ${SEED_LOAD:-0}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    profiles:
      - apps
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    # worker 用字面量，见约定 §2.5。不要改成 ${WORKER_ID}，否则六个实例都是 1。
    environment:
      WORKER_ID: "1"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'gateway placeholder: OPS-01 owns /healthz; not started by make up' >&2; exit 1"]
    ports:
      - "8080:8080"
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:6060:6060"
    depends_on: *app-depends

  payment:
    profiles:
      - apps
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    environment:
      WORKER_ID: "2"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'payment placeholder: OPS-01 owns /healthz; not started by make up' >&2; exit 1"]
    ports:
      - "127.0.0.1:8881:8881"
      - "127.0.0.1:6061:6061"
    depends_on: *app-depends

  account:
    profiles:
      - apps
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    environment:
      WORKER_ID: "3"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'account placeholder: OPS-01 owns /healthz; not started by make up' >&2; exit 1"]
    ports:
      - "127.0.0.1:8882:8882"
      - "127.0.0.1:6062:6062"
    depends_on: *app-depends

  recon:
    profiles:
      - apps
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    environment:
      WORKER_ID: "4"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'recon placeholder: OPS-01 owns /healthz; not started by make up' >&2; exit 1"]
    ports:
      - "127.0.0.1:8883:8883"
      - "127.0.0.1:6063:6063"
    depends_on: *app-depends

  channel-mock:
    profiles:
      - apps
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    environment:
      WORKER_ID: "5"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'channel-mock placeholder: OPS-01 owns /healthz; not started by make up' >&2; exit 1"]
    ports:
      - "9080:9080"
      - "127.0.0.1:6064:6064"
    depends_on: *app-depends

  merchant-demo:
    profiles:
      - apps
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    environment:
      WORKER_ID: "6"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'merchant-demo placeholder: OPS-01 owns /healthz; not started by make up' >&2; exit 1"]
    ports:
      - "9100:9100"
    depends_on: *app-depends

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  prometheus-data:
